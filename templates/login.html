<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script type="text/javascript" src="{{ url_for('static', path='index.js') }}" > </script>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oleo+Script:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
{% import "navbar.html" as navbar with context %}
{{ navbar.navbar() }}

<main style="background-color: white;" class="login-main">
    <div class="login-root-container glass">
        <h2 class="login-header">Authorize</h2>
        <form action="/api/login">
        <div class="login-input-group">
            <label for="login" class="login-label">Login</label>
            <div class="login-input-parent">
                <input type="text" id="login" name="login" placeholder="john.doe@example.com" class="login-input">
            </div>
        </div>
        <div class="login-input-group">
            <label for="password" class="login-label">Password</label>
            <div class="login-input-parent">
                <input type="password" id="password" name="password" placeholder="************" class="login-input">
                <img src="{{ url_for('static', path='eye-regular-full.svg') }}" role="button" class="login-eye-icon" draggable="false" alt="show/hide" onClick="hidePassword()">
            </div>
            <a href="" class="login-forgot-password"> Forgot password?</a>
        </div>
        <span class="login-error">Wrong login or/and password. Please check the spelling and try again. </span>
        <div class="login-button-container">
            <button class="login-button-primary">Log in</button>
            <a class="login-button-secondary">Register</a>
        </div>
        </form>
    </div>
</main>
{% import "footer.html" as footer with context %}
{{ footer.footer() }}
</body>
<script>
    function hidePassword() {
        let item = document.querySelector('#password')
        if (item.type === 'password') {
            item.type = 'text'
        } else {
            item.type = 'password'
        }
    }
</script>
</html>
